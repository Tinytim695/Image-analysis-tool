name: Shell quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          bash -n install.sh
          mkdir -p /tmp/image-tool-check
          sed -n '/cat > "\$TARGET" <<'"'"'SCRIPT'"'"'/,/^SCRIPT$/p' install.sh | sed '1d;$d' > /tmp/image-tool-check/image
          bash -n /tmp/image-tool-check/image

      - name: Public hygiene check
        shell: bash
        run: |
          if grep -RInE             --exclude-dir=.git             --exclude='quality.yml'             'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|@gmail\.com|@outlook\.com|@icloud\.com' .; then
            echo "Potential credential or private-email pattern found."
            exit 1
          fi
